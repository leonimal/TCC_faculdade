name: tcc-iot

services:
  mysql:
    image: mysql:8.4.11
    container_name: tcc-iot-mysql
    restart: unless-stopped
    env_file:
      - ./database/mysql.env.local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - tcc_iot_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  tcc_iot_mysql_data:
    name: tcc-iot-mysql-data
